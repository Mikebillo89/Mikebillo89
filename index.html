<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Optimiser Prototype</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/heatmap.js/2.0.5/heatmap.min.js"></script>
</head>
<body>
    <h1>WiFi Optimiser Prototype</h1>
    <section id="heatmap-section">
        <h2>Real-time Heatmap</h2>
        <input type="file" id="floorplan-upload" accept="image/*">
        <input type="file" id="data-upload" accept=".csv,.json">
        <div id="floorplan-container">
            <img id="floorplan-img" src="" alt="Floor plan" style="display:none;">
            <div id="heatmapContainer"></div>
        </div>
    </section>

    <section id="ar-section">
        <h2>AR Visualisation</h2>
        <p>Placeholder for AR view showing router locations and coverage guides.</p>
    </section>

    <section id="topology-section">
        <h2>Network Topology</h2>
        <svg id="topology" width="400" height="200">
            <circle cx="50" cy="100" r="20" fill="lightblue"></circle>
            <text x="50" y="95" text-anchor="middle" font-size="10">Router</text>
            <circle cx="200" cy="50" r="15" fill="lightgreen"></circle>
            <text x="200" y="45" text-anchor="middle" font-size="10">Extender</text>
            <circle cx="350" cy="100" r="20" fill="lightblue"></circle>
            <text x="350" y="95" text-anchor="middle" font-size="10">Mesh</text>
            <line x1="70" y1="100" x2="185" y2="55" stroke="gray" />
            <line x1="215" y1="55" x2="330" y2="100" stroke="gray" />
        </svg>
    </section>

    <section id="chat-section">
        <h2>Ask Mike</h2>
        <div id="chat-box"></div>
        <input type="text" id="chat-input" placeholder="Ask about coverage...">
        <button id="chat-send">Send</button>
    </section>

    <section id="leaderboard-section">
        <h2>Leaderboard</h2>
        <table id="leaderboard">
            <thead>
                <tr><th>User</th><th>Network Score</th></tr>
            </thead>
            <tbody>
                <tr><td>Alice</td><td>95</td></tr>
                <tr><td>Bob</td><td>88</td></tr>
                <tr><td>You</td><td>92</td></tr>
            </tbody>
        </table>
    </section>

    <section id="isp-section">
        <h2>ISP Dashboard</h2>
        <table id="isp-stats">
            <thead>
                <tr><th>Average Signal</th><th>Peak Traffic</th><th>Error Rate</th></tr>
            </thead>
            <tbody>
                <tr><td>-58 dBm</td><td>150 Mbps</td><td>0.1%</td></tr>
            </tbody>
        </table>
        <button id="support-btn">Request remote support</button>
    </section>

    <script src="script.js"></script>
</body>
</html>
